name: Weekly Chart Delivery (土曜09時 週足配信)

on:
  schedule:
    # 毎週土曜日 00:00 UTC (＝ 日本時間 土曜日 09:00 JST)
    - cron: '0 0 * * 6'
  workflow_dispatch: # GitHub画面からの手動実行トリガー

jobs:
  deliver-weekly-charts:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.10 のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 日本語フォントパッケージのインストール (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Python依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 週足チャート配信スクリプトの実行
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: |
          python scripts/delivery.py --type weekly
